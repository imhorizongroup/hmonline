<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HolyMade - Faith-inspired content and products for your spiritual journey.">
    <meta property="og:title" content="HolyMade">
    <meta property="og:description" content="Faith-inspired content and products.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://holymade.online/">
    <title>HolyMade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background-color: #faf9f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .hero {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            text-align: center;
            padding: 100px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .hero p {
            font-size: 1.2em;
            opacity: 0.85;
            font-weight: 300;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .hero a {
            color: white;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1em;
            transition: all 0.3s;
        }
        .hero a:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
        }
        footer {
            background: #1a252f;
            color: rgba(255,255,255,0.6);
            text-align: center;
            padding: 20px;
            font-size: 0.85em;
        }
        footer a { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="hero">
        <h1>HolyMade</h1>
        <p>Faith-inspired content and products for your spiritual journey. Strengthening your walk with God, one day at a time.</p>
        <a href="/faith/">Explore Our Devotionals</a>
    </div>
    <footer>
        <p>Copyright 2026 &ndash; HolyMade &reg; &mdash; All rights reserved.</p>
        <p style="margin-top:8px;"><a href="/terms.html">Terms of Use</a> &ndash; <a href="/privacy.html">Privacy Policy</a></p>
    </footer>
</body>
</html>
